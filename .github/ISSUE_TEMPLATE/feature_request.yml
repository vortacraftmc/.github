name: Feature request
description: Suggest an improvement or new capability.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Note that this organization is on a **maintenance pause** (see
        [vortacraftmc/core](https://github.com/vortacraftmc/core#project-status-maintenance-paused)).
        Ideas are welcome and will be recorded, but may not be implemented soon.
  - type: input
    id: project
    attributes:
      label: Which project would this apply to?
      placeholder: e.g. macroEngine, guikit, a new pack
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
