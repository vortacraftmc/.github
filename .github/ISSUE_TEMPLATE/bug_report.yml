name: Bug report
description: Something is broken or behaves incorrectly.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search existing issues first.
        **Do not use this form for security problems** - see
        [SECURITY.md](https://github.com/vortacraftmc/.github/blob/main/SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Which part of the project?
      options: [Datapack, Fabric mod, Script / tooling, Documentation, Other]
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project name
      placeholder: e.g. TunnelScript, datapack-fixer, dpgen
    validations:
      required: true
  - type: input
    id: mc-version
    attributes:
      label: Minecraft version
      placeholder: e.g. 1.21.4
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Loader and version (mods only)
      placeholder: e.g. Fabric Loader 0.16.9 / Fabric API 0.110.0
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: Minimal steps. Attach logs where relevant.
    validations:
      required: true
